<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificação de Cartas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Cartas Criadas</h1>

    <div class="actions">
      <a href="/cadastro" class="botao">Cadastrar Nova Carta</a>
      <a href="/" class="botao sair">Sair</a>
    </div>

    <table>
      <thead>
        <img src="{{ url_for('static', filename='img/bruxa.png') }}">
        <tr>
          <th>Nome</th>
          <th>Elixir</th>
          <th>Raridade</th>
        </tr>
      </thead>
      <tbody>
        {% for p in produtos %}
        <tr>
          <td>{{ p[1] }}</td>
          <td>{{ p[2] }}</td>
          <td>{{ p[3] }}</td>
          <td>{{ p[4] }}</td>
          <td>
            <!-- Botão de excluir -->
            <form action="/excluir/{{ p[0] }}" method="POST" style="display:inline;">
              <button type="submit" class="botao excluir">Excluir</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
