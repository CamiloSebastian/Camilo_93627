<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Inscrição para o Evento</title>
</head>
<body>

  <!-- Cabeçalho e Introdução -->
  <h1>Inscrição para o Evento</h1>
  <p>Participe do nosso evento especial com palestras, workshops e oportunidades de networking. Preencha o formulário abaixo para garantir sua vaga!</p>

  <!-- Formulário de Inscrição -->
  <form action="#" method="post">

    <!-- Informações Pessoais -->
    <fieldset>
      <legend>Informações Pessoais</legend>

      <label for="nome">Nome completo:</label><br>
      <input type="text" id="nome" name="nome" required><br><br>

      <label for="email">E-mail:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="telefone">Número de telefone:</label><br>
      <input type="text" id="telefone" name="telefone" required><br><br>
    </fieldset>

    <!-- Gênero -->
    <fieldset>
      <legend>Gênero</legend>

      <input type="radio" id="masculino" name="genero" value="masculino" required>
      <label for="masculino">Masculino</label><br>

      <input type="radio" id="feminino" name="genero" value="feminino">
      <label for="feminino">Feminino</label><br>

      <input type="radio" id="outro" name="genero" value="outro">
      <label for="outro">Outro</label><br>
    </fieldset>

    <!-- Interesses -->
    <fieldset>
      <legend>Interesse no Evento</legend>

      <input type="checkbox" id="palestras" name="interesses" value="palestras">
      <label for="palestras">Palestras</label><br>

      <input type="checkbox" id="workshops" name="interesses" value="workshops">
      <label for="workshops">Workshops</label><br>

      <input type="checkbox" id="networking" name="interesses" value="networking">
      <label for="networking">Networking</label><br>
    </fieldset>

    <!-- Data de Participação -->
    <fieldset>
      <legend>Data de Participação</legend>

      <label for="data">Escolha a data:</label><br>
      <input type="date" id="data" name="data" required><br>
    </fieldset><br>

    <!-- Botão de Envio -->
    <input type="submit" value="Enviar Inscrição">

  </form>

  <!-- Mensagem de Confirmação (Opcional) -->
  <p><em>Sua inscrição foi recebida com sucesso!</em></p>

</body>
</html>
