<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormsTab</title>
</head>
<body>
    <header>
        <center>
        <table>
             <tr>
               <td><img src="img/juri.jpeg" width="50" height="50"></td>
               <td><h2>Formulário de Produtos e Serviços</h2></td>
             </tr>
        </table>
        </center>
    </header>
    
    <center><form action="">
        <label for="Adicionar Leitura">Nome</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefone">Telefone</label>
        <input type="number" id="telefone" name="telefone" required><br><br>


        <label for="sps">Seleção de produto</label>
        <select id="sps"Cidade name="sps" required>
            <option value="sde">Shampoo da Ereskigal</option>
            <option value="pm">Paty Maionese</option>
            <option value="hy">Handboll Yaoth</option>
            <option value="edf">Espada de Fogo</option>
            <option value="mund">Mundial</option>
        </select><br><br>

        <label for="sps">Seleção de serviço</label>
        <select id="sps"Cidade name="sps" required>
            <option value="gg">Gigolô</option>
            <option value="mas">Massagista</option>
            <option value="mas">Zelador</option>
            <option value="tr">Terrorista</option>
            <option value="pv">Progamador VisualG</option>
        </select><br><br>

        <label for="mensagem">Área para mensagem</label>
        <input type="text" name="mensagem" id="mensagem"><br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar Formulário"><br><br><br><br>
    </form></center>
        
        <center><table border="1">
            <tr>
                <th align="center">Produtos Disponíveis</th>
                <th align="center">Serviços Disponíveis</th>
            </tr>
            <tr>
                <td>Shampoo da Ereskigal</td>
                <td>Gigolô</td>
            </tr>
            <tr>
                <td>Paty Maionese</td>
                <td>Massagista</td>
            </tr>
            <tr>
                <td>Handboll Yaoth</td>
                <td>Zelador</td>
            </tr>
            <tr>
                <td>Espada de Fogo</td>
                <td>Terrorista</td>
            </tr>
            <tr>
                <td>Mundial</td>
                <td>Progamador VisualG</td>
            </tr>
        </table></center>
</body>
</html>
