<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para evento</title>
</head>

<body bgcolor="cyan">
    <center>
    
            <table>
             <tr>
               <td><img src="imagem-esquerda.png" width="50" height="50"></td>
               <td><h1>Inscrição para o Evento</h1></td>
               <td><img src="imagem-direita.png" width="50" height="50"></td>
             </tr>
            </table>
          <h2>Se inscreva porque o evento é legal</h2>

        <form action="submit" method="post">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required><br><br>



        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required><br><br>


        <label for="numero">Número de telefone</label>
        <input type="number" id="numero" name="numero" required><br><br>


        <label for="genero">Gênero</label>
        <input type="radio" id="masculino" name="genero" required>
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="feminino" name="genero" required>
        <label for="feminino">Feminino</label><br>
        <input type="radio" id="outro" name="genero" required>
        <label for="outro">Outro</label><br>


        <label for="interesse">Interesse no evento</label><br>
        <input type="checkbox" id="palestra" name="interesse">
        <label for="palestra">Palestras</label><br>
        <input type="checkbox" id="work" name="interesse">
        <label for="work">Workshops</label><br>
        <input type="checkbox" id="net" name="interesse">
        <label for="net">Networking</label><br>

        <label for="data">Data de Participação</label>
        <input type="date" id="data" name="data" required><br><br>

        <input type="submit" value="Enviar Inscrição">
        </form>
    </center>
</body>
</html>
