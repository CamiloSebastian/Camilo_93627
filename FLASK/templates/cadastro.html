<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Cartas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Cartas</h1>

    <form action="/salvar" method="POST">
      <label for="nome">Nome da Carta:</label>
      <input type="text" id="nome" name="nome" placeholder="Ex: Golem de gelo" required>

      <label for="elixir">Elixir:</label>
      <input type="number" id="elixir" name="elixir" step="0.01" placeholder="Ex: 1,3,6" required>

      <label for="raridade">Rarirdade:</label>
      <input type="text" id="raridade" name="raridade" placeholder="Ex: Comum,rara" required>

      <button type="submit">Salvar Carta</button>
    </form>

    <a href="/" class="voltar">← Voltar à Lista</a>
  </div>
</body>
</html>
